name: Run
on: [push, workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run
        run: |
          export LD_LIBRARY_PATH=.
          chmod +x pawncc

          ./pawncc -d3 -i"inc" main.pwn

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          archive: false
          path: main.amx