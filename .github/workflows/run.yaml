name: Run
on: [push, workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run
        run: |
          chmod +x pawncc
          for src in src/*.pwn; do
            ./pawncc -iinc -d3 "$src"
          done

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gamemodes
          path: "*.amx"