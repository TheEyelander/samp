name: Compile
on: [push, workflow_dispatch]
jobs:
  compile:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up
        run: curl -fsSL https://github.com/openmultiplayer/compiler/releases/download/v3.10.11/pawnc-3.10.11-linux.tar.gz | tar -xz -f - pawnc-3.10.11-linux/bin/pawncc /pawnc-3.10.11-linux/lib/libpawnc.so

      - name: Compile
        run: |
          chmod +x pawncc
          find sources -type f -exec ./pawncc -iincludes -d3 {} \;

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gamemodes
          path: "*.amx"